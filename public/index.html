<script>
(function(){
  try{
    var saved = localStorage.getItem("khata_theme");
    var prefDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var t = saved || (prefDark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>

<body>
<header class="top"><div class="wrap">

    <button class="iconbtn" id="btnQuickLock" aria-label="Lock screen" title="Lock screen" data-act="quickLock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
